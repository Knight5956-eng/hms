name: Frontend CI & Static Deployment Build

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linter
        run: |
          cd frontend
          npm run lint

      - name: Run Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Static Output
        run: |
          npm run build

      - name: Verify Static Build Dist Output
        run: |
          test -d dist && test -f dist/index.html
